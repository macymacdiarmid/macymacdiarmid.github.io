            <section class="gallery-intro">
                <h2>Uganda in Focus</h2>
                <p>A look inside the schools, communities, and lives that Go Be Love's impact purchasing model is changing — one classroom at a time.</p>
            </section>

            <main class="gallery-main">

                <figure>
                    <img src="uganda-1.jpg" alt="A large group of children in school uniforms and adult volunteers wave and smile together on the grounds of a school in Uganda." />
                    <figcaption>Students and Go Be Love volunteers at a partner school in Uganda.</figcaption>
                </figure>

                <figure>
                    <img src="uganda-5.jpg" alt="A young girl in a purple school uniform looks up at the camera with a wide smile, standing on the sandy grounds outside her school in Uganda." />
                    <figcaption>A student at a Go Be Love partner school. Girls in rural districts are among those most impacted by the program.</figcaption>
                </figure>

                <figure>
                    <img src="uganda-6.jpg" alt="Students at Redeemer Junior School in Jinja, Uganda, raise their hands and wave from rows of wooden desks in a sunlit classroom." />
                    <figcaption>Students at Redeemer Junior School in Jinja — one of the schools supported by Go Be Love's impact model.</figcaption>
                </figure>

                <figure>
                    <img src="uganda-7.jpg" alt="A girl in a gray school uniform turns toward the camera with a bright smile, a red heart sticker on her forehead, in a classroom decorated with student artwork." />
                    <figcaption>A student in a well-supplied classroom — a direct result of conscious consumer funding.</figcaption>
                </figure>

                <figure>
                    <img src="uganda-2.jpg" alt="Dozens of children in orange, gray, and white school uniforms wave their hands and smile while seated on steps outside their school in Uganda." />
                    <figcaption>Children at a partner school in northern Uganda, where enrollment has risen by over 30%.</figcaption>
                </figure>

                <figure>
                    <img src="uganda-3.jpg" alt="A young boy in an orange school uniform holds a pencil and smiles beside a chalkboard displaying the Ugandan National Anthem." />
                    <figcaption>A student practices writing at a partner school in Jinja, Uganda.</figcaption>
                </figure>

                <figure>
                    <img src="uganda-4.jpg" alt="A young woman leans down to greet a crowd of children gathered at the doorway of a dedicated classroom in Uganda." />
                    <figcaption>A Go Be Love volunteer greets students at the entrance of a newly funded classroom.</figcaption>
                </figure>

                <figure>
                    <img src="uganda-8.jpg" alt="A selfie taken in Uganda showing a smiling young woman alongside several children against a bright blue sky." />
                    <figcaption>A volunteer shares a moment with students during a school visit in rural Uganda.</figcaption>
                </figure>

            </main>
