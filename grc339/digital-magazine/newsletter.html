<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="https://use.typekit.net/slj7cyg.css">
        <title>Subscribe – Go Be Love</title>
    </head>

    <body>
        <div class="container">

            <header>
                <h1>
                    <a href="index.html">
                        <img src="gbl-logo.svg" alt="Go Be Love." />
                    </a>
                </h1>
                <nav>
                    <ul>
                        <li><a href="#">Style</a></li>
                        <li><a href="#">Impact</a></li>
                        <li><a href="#">Education</a></li>
                        <li><a href="#">Culture</a></li>
                        <li><a href="#">About</a></li>
                    </ul>
                </nav>
            </header>

            <main>

                <figure class="newsletter-hero">
                    <img src="apparel-2.jpg" alt="A woman in a bright yellow puffer jacket and narrow sunglasses poses in direct sunlight against a white wall." />
                </figure>

                <section class="newsletter-form">

                    <h2>Stay in the Loop</h2>
                    <p>Join the Go Be Love community. Choose the newsletters that matter most to you — we'll send stories of style, impact, and change straight to your inbox.</p>

                    <form action="#" method="post">

                        <div class="form-field">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" placeholder="Your full name" required />
                        </div>

                        <div class="form-field">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="your@email.com" required />
                        </div>

                        <fieldset>
                            <legend>Choose your newsletters</legend>

                            <div class="form-check">
                                <input type="checkbox" id="nl-style" name="newsletters" value="style" />
                                <label for="nl-style">Style &amp; Fashion — Trends, conscious brands, and dressing with intention.</label>
                            </div>

                            <div class="form-check">
                                <input type="checkbox" id="nl-impact" name="newsletters" value="impact" />
                                <label for="nl-impact">Impact Stories — On-the-ground reports from Uganda and partner communities.</label>
                            </div>

                            <div class="form-check">
                                <input type="checkbox" id="nl-education" name="newsletters" value="education" />
                                <label for="nl-education">Education Updates — Data, progress reports, and stories from partner schools.</label>
                            </div>

                            <div class="form-check">
                                <input type="checkbox" id="nl-culture" name="newsletters" value="culture" />
                                <label for="nl-culture">Culture &amp; Community — Art, music, and people shaping purpose-driven culture.</label>
                            </div>

                        </fieldset>

                        <button type="submit">Subscribe</button>

                    </form>

                </section>

            </main>

            <footer>
                <p>© 2025 Go Be Love. All rights reserved.</p>
            </footer>

        </div>
    </body>
</html>
